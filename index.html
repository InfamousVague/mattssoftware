<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Matt's Software — Tiny apps that earn their keep</title>
    <meta
      name="description"
      content="A small shop of tiny, free, open-source apps you'll actually use. One launcher installs them all and keeps them up to date — or grab any of them on their own."
    />
    <meta name="theme-color" content="#0c0a12" />

    <!-- Favicon: the same white ">|M" mark as the site navbar, on
         a dark squircle so it stays legible on light browser tab
         bars. Apple-touch-icon is the full-colour launcher squircle
         (better for iOS home-screen contexts than a bare mark). -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/launcher-icon.png" />

    <!-- Open Graph — for previews on Twitter / iMessage / Slack /
         Discord. Points at the home desk diorama for now; will be
         swapped to a dedicated /_brand/og-card.png once that asset
         is generated (see REBRAND-ASSET-PROMPTS.md, Tier 2). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Matt's Software" />
    <meta property="og:title" content="Matt's Software — Tiny apps that earn their keep" />
    <meta
      property="og:description"
      content="A small shop of tiny, free, open-source apps. One launcher installs them all and keeps them up to date."
    />
    <meta property="og:url" content="https://mattssoftware.com" />
    <meta property="og:image" content="https://mattssoftware.com/_brand/home-hero-desk.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Matt's Software — Tiny apps that earn their keep" />
    <meta
      name="twitter:description"
      content="A small shop of tiny, free, open-source apps. One launcher installs them all and keeps them up to date."
    />
    <meta name="twitter:image" content="https://mattssoftware.com/_brand/home-hero-desk.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
