<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MattsSoftware: one person's software studio</title>
    <meta
      name="description"
      content="MattsSoftware is one person's software studio. Attack.fm, Libre, PrettyCardboard, Ghost.md, Espresso and a shelf of small Mac utilities."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)" />

    <!-- Favicon — glossy 3D ">|M" mark from the launcher hero,
         swapped light/dark to stay legible on either tab bar:
           • Dark-themed browser → white glyph (`favicon.png`)
           • Light-themed browser → black glyph (`favicon-dark.png`)
         The legacy unconditional <link> below is the dark-mode
         glyph and acts as the fallback for browsers that ignore
         media-conditional icons (older Safari, some feed readers).
         Apple-touch-icon stays the full-colour launcher squircle —
         better than a bare mark on iOS home-screen contexts. -->
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png?v=3" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" href="/launcher-icon.png" />

    <!-- Open Graph — for previews on Twitter / iMessage / Slack /
         Discord. Points at the home desk diorama for now; will be
         swapped to a dedicated /_brand/og-card.png once that asset
         is generated (see REBRAND-ASSET-PROMPTS.md, Tier 2). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MattsSoftware" />
    <meta property="og:title" content="MattsSoftware: one person's software studio" />
    <meta
      property="og:description"
      content="One person's software studio. Attack.fm, Libre, PrettyCardboard, Ghost.md, Espresso and a shelf of small Mac utilities."
    />
    <meta property="og:url" content="https://mattssoftware.com" />
    <meta property="og:image" content="https://mattssoftware.com/_brand/home-hero-desk.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MattsSoftware: one person's software studio" />
    <meta
      name="twitter:description"
      content="One person's software studio. Attack.fm, Libre, PrettyCardboard, Ghost.md, Espresso and a shelf of small Mac utilities."
    />
    <meta name="twitter:image" content="https://mattssoftware.com/_brand/home-hero-desk.png" />

    <!-- Self-hosted Plausible analytics. Privacy-friendly (no
         cookies, no fingerprinting, no PII) so it doesn't need a
         consent banner. `script.outbound-links.js` auto-fires the
         initial pageview and tracks outbound clicks (GitHub,
         App Store, releases) for free; SPA route changes are
         fired manually from React (see `src/lib/analytics.ts` +
         the route-change effect in App.tsx).
         Keeping the script on our own subdomain (`stats.
         mattssoftware.com`) means no third-party cookies, no
         ad-blocker false positives, and corporate firewalls only
         need to whitelist one host. Mirrors the libre.academy
         setup exactly. -->
    <script
      defer
      data-domain="mattssoftware.com"
      src="https://stats.mattssoftware.com/js/script.outbound-links.js"
    ></script>
    <!-- Plausible's standard early-call buffer. Lets us call
         `window.plausible("pageview")` from React before the
         deferred script finishes loading — early calls queue on
         `plausible.q` and the real implementation flushes them
         once it installs itself. Without this, any pageview the
         router fires during the script-load window is lost. -->
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (window.plausible.q = window.plausible.q || []).push(arguments);
        };
    </script>
    <!-- The theme, before first paint. No stored choice means the page
         follows the system: the kit's tokens answer prefers-color-scheme on
         their own, so the attribute is only set for an explicit pick. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("mattssoftware:theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {
          /* private mode: follow the system */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
